<!DOCTYPE html>
<html lang="ko" data-theme="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이든X학원 평가 시스템</title>
<style>
:root {
  --brand:#3B5BDB; --brand-l:#4C6EF5; --brand-d:#2F4AC5;
  --acc:#E03131; --acc-l:#F03E3E;
  --ok:#2F9E44; --ok-bg:#EBFBEE; --ok-bd:#8CE99A;
  --ng:#C92A2A; --ng-bg:#FFF5F5; --ng-bd:#FFA8A8;
  --warn:#E67700;
  --bg:#EEF2FF; --bg2:#F8FAFF;
  --card:#FFFFFF; --q-bg:#F0F4FF;
  --tx:#0F172A; --tx2:#334155; --tx3:#64748B;
  --bd:#CBD5E1; --bd2:#E2E8F0;
  --sh:0 2px 8px rgba(59,91,219,.08),0 1px 3px rgba(0,0,0,.04);
  --sh-lg:0 8px 24px rgba(59,91,219,.13),0 2px 8px rgba(0,0,0,.06);
  --r:14px; --rsm:9px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0D1339;--bg2:#111B44;--card:#1A2456;--q-bg:#1E2E6E;
  --tx:#F1F5F9;--tx2:#CBD5E1;--tx3:#94A3B8;
  --bd:#2D3F7A;--bd2:#253368;
  --sh:0 2px 8px rgba(0,0,0,.35);--sh-lg:0 8px 24px rgba(0,0,0,.45);
}}
:root[data-theme=dark]{
  --bg:#0D1339;--bg2:#111B44;--card:#1A2456;--q-bg:#1E2E6E;
  --tx:#F1F5F9;--tx2:#CBD5E1;--tx3:#94A3B8;
  --bd:#2D3F7A;--bd2:#253368;
  --sh:0 2px 8px rgba(0,0,0,.35);--sh-lg:0 8px 24px rgba(0,0,0,.45);
}
:root[data-theme=light]{
  --bg:#EEF2FF;--bg2:#F8FAFF;--card:#fff;--q-bg:#F0F4FF;
  --tx:#0F172A;--tx2:#334155;--tx3:#64748B;
  --bd:#CBD5E1;--bd2:#E2E8F0;
  --sh:0 2px 8px rgba(59,91,219,.08),0 1px 3px rgba(0,0,0,.04);
  --sh-lg:0 8px 24px rgba(59,91,219,.13);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--tx);font-size:16px;line-height:1.6;min-height:100vh;
  -webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.hidden{display:none!important}

/* ── APP BAR ── */
.app-bar{
  background:var(--brand);color:#fff;height:58px;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:300;
  box-shadow:0 2px 12px rgba(59,91,219,.4);
}
.brand{font-size:20px;font-weight:900;letter-spacing:-.5px}
.brand-x{color:var(--acc)}
.bar-r{display:flex;align-items:center;gap:8px}
.subj-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.3px}
.chip-kor{background:#C92A2A;color:#fff}
.chip-math{background:#1971C2;color:#fff}
.chip-eng{background:#2F9E44;color:#fff}
.chip-other{background:rgba(255,255,255,.2);color:#fff}
.bar-btn{width:34px;height:34px;border-radius:50%;border:none;
  background:rgba(255,255,255,.13);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:background .15s}
.bar-btn:hover{background:rgba(255,255,255,.24)}
.prog-wrap{height:3px;background:var(--brand);position:sticky;top:58px;z-index:299}
.prog-fill{height:3px;background:#74C0FC;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ── SCREENS ── */
.screen{display:none}
.screen.active{display:block}

/* ── UPLOAD ── */
.up-page{max-width:620px;margin:0 auto;padding:24px 16px 100px}
.hero{
  background:linear-gradient(140deg,var(--brand) 0%,#364FC7 100%);
  border-radius:var(--r);padding:28px 24px 30px;color:#fff;
  margin-bottom:16px;position:relative;overflow:hidden;
}
.hero::after{content:'X';position:absolute;right:-6px;top:-16px;
  font-size:130px;font-weight:900;color:rgba(255,255,255,.05);line-height:1;pointer-events:none}
.hero-tag{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.7;margin-bottom:8px}
.hero-h{font-size:26px;font-weight:900;line-height:1.2;margin-bottom:6px}
.hero-sub{font-size:14px;opacity:.8}

.drop-zone{
  background:var(--card);border:2.5px dashed var(--bd);border-radius:var(--r);
  padding:36px 20px;text-align:center;cursor:pointer;margin-bottom:12px;
  transition:border-color .2s,background .2s,box-shadow .2s;
}
.drop-zone:hover,.drop-zone.drag-over{
  border-color:var(--brand-l);background:var(--bg2);
  box-shadow:0 0 0 4px rgba(59,91,219,.08);
}
.drop-icon{font-size:42px;margin-bottom:10px}
.drop-h{font-size:16px;font-weight:700;margin-bottom:5px}
.drop-s{font-size:13px;color:var(--tx3)}
